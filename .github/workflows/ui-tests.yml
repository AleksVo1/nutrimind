name: NutriMind UI tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEADLESS: 'true'
      BASE_URL: ${{ vars.BASE_URL || 'https://play.nutrimind.game.nbt.expert/' }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME || 'demo' }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'demo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install Chromium and system dependencies
        run: mvn -B exec:java -Dexec.args="install --with-deps chromium"
      - name: Run TestNG suite
        run: mvn -B test
      - name: Generate Allure HTML report
        if: always()
        run: mvn -B allure:report
      - name: Upload reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            target/surefire-reports/
            target/artifacts/
            target/allure-results/
            target/allure-report/
          retention-days: 7
